<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Pic Bumper - App 圖示即時預覽</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #18191c;
    color: #e4e4e7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    padding: 32px 24px;
    margin: 0;
  }
  .header {
    max-width: 900px;
    margin: 0 auto 32px auto;
    border-bottom: 1px solid #2e3035;
    padding-bottom: 16px;
  }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px 0; color: #fff; }
  p { margin: 0; color: #a1a1aa; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: #23252a;
    border: 1px solid #33363e;
    border-radius: 16px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #f4f4f5;
  }
  .card-desc {
    font-size: 12px;
    color: #8e8e99;
    text-align: center;
  }
  .icon-stage {
    width: 144px;
    height: 144px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .checkerboard {
    background-image: linear-gradient(45deg, #2b2b2b 25%, transparent 25%),
                      linear-gradient(-45deg, #2b2b2b 25%, transparent 25%),
                      linear-gradient(45deg, transparent 75%, #2b2b2b 75%),
                      linear-gradient(-45deg, transparent 75%, #2b2b2b 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: #202020;
    border-radius: 12px;
  }
  /* Masks simulating Android Adaptive Icon 72dp display within 108dp canvas (66.67%) */
  .mask-circle {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  }
  .mask-circle svg {
    position: absolute;
    left: -24px;
    top: -24px;
    width: 144px;
    height: 144px;
  }
  .mask-squircle {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  }
  .mask-squircle svg {
    position: absolute;
    left: -24px;
    top: -24px;
    width: 144px;
    height: 144px;
  }
  .full-preview {
    width: 144px;
    height: 144px;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  }
  .full-preview svg {
    width: 144px;
    height: 144px;
  }
  .safe-ring {
    position: absolute;
    width: 96px;
    height: 96px;
    left: 24px;
    top: 24px;
    border: 2px dashed rgba(255, 255, 255, 0.45);
    border-radius: 50%;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Pic Bumper - Android 圖示預覽</h1>
    <p>依據 <code>ic_launcher_foreground.xml</code> 與 <code>ic_launcher_background.xml (#FFB732)</code> 即時渲染</p>
  </div>

  <div class="grid">
    <!-- 1. Circle Mask -->
    <div class="card">
      <div class="card-title">圓形裁切 (Circle)</div>
      <div class="icon-stage">
        <div class="mask-circle">
          <svg viewBox="0 0 108 108">
            <rect width="108" height="108" fill="#FFB732"/>
            <path fill="#000000" stroke="#000000" stroke-width="2.64" stroke-linejoin="round" d="M 35.28,23.64 h 10.97 a 2.75,2.75 0 0 1 2.75,2.75 v 10.97 a 2.75,2.75 0 0 1 -2.75,2.75 h -10.97 a 2.75,2.75 0 0 1 -2.75,-2.75 v -10.97 a 2.75,2.75 0 0 1 2.75,-2.75 z" />
            <path fill="#FFFFFF" stroke="#000000" stroke-width="2.64" stroke-linejoin="round" d="M 35.28,45.76 h 10.97 a 2.75,2.75 0 0 1 2.75,2.75 v 10.97 a 2.75,2.75 0 0 1 -2.75,2.75 h -10.97 a 2.75,2.75 0 0 1 -2.75,-2.75 v -10.97 a 2.75,2.75 0 0 1 2.75,-2.75 z" />
            <path fill="#FFFFFF" stroke="#000000" stroke-width="2.64" stroke-linejoin="round" d="M 35.28,67.89 h 10.97 a 2.75,2.75 0 0 1 2.75,2.75 v 10.97 a 2.75,2.75 0 0 1 -2.75,2.75 h -10.97 a 2.75,2.75 0 0 1 -2.75,-2.75 v -10.97 a 2.75,2.75 0 0 1 2.75,-2.75 z" />
            <path fill="#00000000" stroke="#000000" stroke-width="5.60" stroke-linecap="round" stroke-linejoin="round" d="M 61.07,34.07 A 22.25,21.20 91.4 0 1 74.83,70.50" />
            <path fill="#00000000" stroke="#000000" stroke-width="5.60" stroke-linecap="round" stroke-linejoin="round" d="M 69.36,26.59 L 59.37,32.57 L 64.98,42.78" />
          </svg>
        </div>
      </div>
      <div class="card-desc">Google Pixel、Motorola、Xiaomi 原生桌面效果</div>
    </div>

    <!-- 2. Squircle Mask -->
    <div class="card">
      <div class="card-title">圓角方塊 (Squircle)</div>
      <div class="icon-stage">
        <div class="mask-squircle">
          <svg viewBox="0 0 108 108">
            <rect width="108" height="108" fill="#FFB732"/>
            <path fill="#000000" stroke="#000000" stroke-width="2.64" stroke-linejoin="round" d="M 35.28,23.64 h 10.97 a 2.75,2.75 0 0 1 2.75,2.75 v 10.97 a 2.75,2.75 0 0 1 -2.75,2.75 h -10.97 a 2.75,2.75 0 0 1 -2.75,-2.75 v -10.97 a 2.75,2.75 0 0 1 2.75,-2.75 z" />
            <path fill="#FFFFFF" stroke="#000000" stroke-width="2.64" stroke-linejoin="round" d="M 35.28,45.76 h 10.97 a 2.75,2.75 0 0 1 2.75,2.75 v 10.97 a 2.75,2.75 0 0 1 -2.75,2.75 h -10.97 a 2.75,2.75 0 0 1 -2.75,-2.75 v -10.97 a 2.75,2.75 0 0 1 2.75,-2.75 z" />
            <path fill="#FFFFFF" stroke="#000000" stroke-width="2.64" stroke-linejoin="round" d="M 35.28,67.89 h 10.97 a 2.75,2.75 0 0 1 2.75,2.75 v 10.97 a 2.75,2.75 0 0 1 -2.75,2.75 h -10.97 a 2.75,2.75 0 0 1 -2.75,-2.75 v -10.97 a 2.75,2.75 0 0 1 2.75,-2.75 z" />
            <path fill="#00000000" stroke="#000000" stroke-width="5.60" stroke-linecap="round" stroke-linejoin="round" d="M 61.07,34.07 A 22.25,21.20 91.4 0 1 74.83,70.50" />
            <path fill="#00000000" stroke="#000000" stroke-width="5.60" stroke-linecap="round" stroke-linejoin="round" d="M 69.36,26.59 L 59.37,32.57 L 64.98,42.78" />
          </svg>
        </div>
      </div>
      <div class="card-desc">Samsung One UI、ColorOS、MIUI 圓角效果</div>
    </div>

    <!-- 3. Foreground Only -->
    <div class="card">
      <div class="card-title">純前景透明層 (Foreground)</div>
      <div class="icon-stage checkerboard">
        <svg viewBox="0 0 108 108" style="width: 144px; height: 144px;">
          <path fill="#000000" stroke="#000000" stroke-width="3" stroke-linejoin="round" d="M 34.75,27.62 h 9.53 a 2.39,2.39 0 0 1 2.39,2.39 v 9.53 a 2.39,2.39 0 0 1 -2.39,2.39 h -9.53 a 2.39,2.39 0 0 1 -2.39,-2.39 v -9.53 a 2.39,2.39 0 0 1 2.39,-2.39 z" />
          <path fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-linejoin="round" d="M 34.75,46.84 h 9.53 a 2.39,2.39 0 0 1 2.39,2.39 v 9.53 a 2.39,2.39 0 0 1 -2.39,2.39 h -9.53 a 2.39,2.39 0 0 1 -2.39,-2.39 v -9.53 a 2.39,2.39 0 0 1 2.39,-2.39 z" />
          <path fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-linejoin="round" d="M 34.75,66.07 h 9.53 a 2.39,2.39 0 0 1 2.39,2.39 v 9.53 a 2.39,2.39 0 0 1 -2.39,2.39 h -9.53 a 2.39,2.39 0 0 1 -2.39,-2.39 v -9.53 a 2.39,2.39 0 0 1 2.39,-2.39 z" />
          <path fill="#00000000" stroke="#000000" stroke-width="4.72" stroke-linecap="round" stroke-linejoin="round" d="M 58.79,36.24 A 18.46,18.46 0 0 1 74.78,45.47 A 18.46,18.46 0 0 1 74.78,63.93 A 18.46,18.46 0 0 1 58.79,73.16" />
          <path fill="#00000000" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M 66.71,30.4 L 58.43,36.08 L 63.8,44.56" />
        </svg>
      </div>
      <div class="card-desc"><code>ic_launcher_foreground.xml</code> 單獨層</div>
    </div>

    <!-- 4. Full 108dp Canvas + Safe Ring -->
    <div class="card">
      <div class="card-title">完整 108dp 畫布與安全區</div>
      <div class="icon-stage">
        <div class="full-preview">
          <svg viewBox="0 0 108 108">
            <rect width="108" height="108" fill="#FFB732"/>
            <path fill="#000000" stroke="#000000" stroke-width="2.64" stroke-linejoin="round" d="M 35.28,23.64 h 10.97 a 2.75,2.75 0 0 1 2.75,2.75 v 10.97 a 2.75,2.75 0 0 1 -2.75,2.75 h -10.97 a 2.75,2.75 0 0 1 -2.75,-2.75 v -10.97 a 2.75,2.75 0 0 1 2.75,-2.75 z" />
            <path fill="#FFFFFF" stroke="#000000" stroke-width="2.64" stroke-linejoin="round" d="M 35.28,45.76 h 10.97 a 2.75,2.75 0 0 1 2.75,2.75 v 10.97 a 2.75,2.75 0 0 1 -2.75,2.75 h -10.97 a 2.75,2.75 0 0 1 -2.75,-2.75 v -10.97 a 2.75,2.75 0 0 1 2.75,-2.75 z" />
            <path fill="#FFFFFF" stroke="#000000" stroke-width="2.64" stroke-linejoin="round" d="M 35.28,67.89 h 10.97 a 2.75,2.75 0 0 1 2.75,2.75 v 10.97 a 2.75,2.75 0 0 1 -2.75,2.75 h -10.97 a 2.75,2.75 0 0 1 -2.75,-2.75 v -10.97 a 2.75,2.75 0 0 1 2.75,-2.75 z" />
            <path fill="#00000000" stroke="#000000" stroke-width="5.60" stroke-linecap="round" stroke-linejoin="round" d="M 61.07,34.07 A 22.25,21.20 91.4 0 1 74.83,70.50" />
            <path fill="#00000000" stroke="#000000" stroke-width="5.60" stroke-linecap="round" stroke-linejoin="round" d="M 69.36,26.59 L 59.37,32.57 L 64.98,42.78" />
          </svg>
          <div class="safe-ring"></div>
        </div>
      </div>
      <div class="card-desc">虛線內為 72dp 系統裁切安全區</div>
    </div>
  </div>
</body>
</html>
